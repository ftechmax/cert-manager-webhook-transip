apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

replacements:
  - source:
      kind: ConfigMap
      name: transip-webhook-settings
      fieldPath: data.email
    targets:
      - select:
          kind: ClusterIssuer
        fieldPaths:
          - spec.acme.email
  - source:
      kind: ConfigMap
      name: transip-webhook-settings
      fieldPath: data.image
    targets:
      - select:
          kind: Deployment
          name: transip-webhook
        fieldPaths:
          - spec.template.spec.containers.[name=webhook].image
