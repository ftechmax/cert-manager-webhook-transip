apiVersion: apps/v1
kind: Deployment
metadata:
  name: transip-webhook
  namespace: cert-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transip-webhook
  template:
    metadata:
      labels:
        app: transip-webhook
    spec:
      serviceAccountName: transip-webhook
      containers:
        - name: webhook
          image: registry:5000/cert-manager-webhook-transip:latest
          args:
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port=8443
          env:
            - name: GROUP_NAME
              value: acme.transip.nl
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: transip-webhook-tls
