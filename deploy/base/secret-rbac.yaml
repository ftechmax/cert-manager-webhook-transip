apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: transip-webhook:secret-reader
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: transip-webhook:secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: transip-webhook:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: transip-webhook
    namespace: cert-manager
