# Keep resourceNames in sync with the solver's credentials secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: transip-webhook:secret-reader
  namespace: cert-manager
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - transip-credentials
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: transip-webhook:secret-reader
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: transip-webhook:secret-reader
subjects:
  - kind: ServiceAccount
    name: transip-webhook
    namespace: cert-manager
