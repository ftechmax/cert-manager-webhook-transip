apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transip-webhook
  namespace: cert-manager
spec:
  podSelector:
    matchLabels:
      app: transip-webhook
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # API server and probes use host IPs, so restrict ingress by port only.
    - ports:
        - protocol: TCP
          port: 8443
  egress:
    # Omit podSelector: Kustomize would inject app labels and exclude CoreDNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Kubernetes and TransIP HTTPS; 6443 covers Kubernetes after DNAT.
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
