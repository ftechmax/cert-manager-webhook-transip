# Example: Update existing Gateway in istio-ingress to add public domain TLS
# Apply with: kubectl apply -f gateway-patch.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: istio-ingress
  labels:
    app.kubernetes.io/part-of: istio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: istio
  listeners:
    # Keep existing local listeners
    - name: http
      hostname: "*.kube.local"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-local
      hostname: "*.kube.local"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-kube-local-tls
      allowedRoutes:
        namespaces:
          from: All

    # Add public domain listeners (cert-manager auto-creates Certificate from these)
    - name: https-public
      hostname: "yourdomain.nl"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: yourdomain-nl-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-public-wildcard
      hostname: "*.yourdomain.nl"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-yourdomain-nl-tls
      allowedRoutes:
        namespaces:
          from: All
